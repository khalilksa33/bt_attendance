name: Deploy to Host A

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax checks
        run: |
          python -m py_compile daily_checkin_log.py
          python -m py_compile attendance_bot.py
          python -m py_compile portal.py
          python -m py_compile admin_portal.py

      - name: Create SSH key from secrets
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOST_A_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_A_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Host A via SSH
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.HOST_A_USER }}@${{ secrets.HOST_A_IP }} \
            "cd /home/${{ secrets.HOST_A_USER }}/bt_attendance && \
             git pull origin main && \
             python -m venv .venv 2>/dev/null || true && \
             source .venv/bin/activate && \
             pip install --upgrade pip && \
             pip install -r requirements.txt && \
             systemctl --user restart portal attendance-bot admin-portal 2>/dev/null || true && \
             echo 'Deployment completed successfully'"

      - name: Notify deployment success
        if: success()
        run: echo "✅ Deployment to Host A (192.168.8.250) completed successfully"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment to Host A failed. Check the logs above."
