<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Remote Check-in</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
</head>
<body>
    <div class="page-shell">
        <div class="hero-panel">
            <div class="hero-copy">
                <span class="eyebrow">Remote Check-in</span>
                <h1>Secure field attendance</h1>
                <p>Submit your work check-in securely from the field. You're logged in with your ERP credentials—each check-in is protected and saved to the attendance database.</p>
            </div>
            <div class="hero-card">
                <form id="checkinForm">
                    <div class="form-group">
                        <label for="user_id">Employee ID</label>
                        <input id="user_id" name="user_id" type="text" placeholder="Enter your ID" required>
                    </div>
                    <div class="form-group">
                        <label for="timestamp">Check-in time (optional)</label>
                        <input id="timestamp" name="timestamp" type="datetime-local">
                    </div>
                    <button type="submit">Submit Check-in</button>
                    <div id="message" class="message"></div>
                </form>
                <div class="hint-panel">
                    <p>Leave the timestamp blank to use the current time.</p>
                    <p><a href="/logout" style="color: #7dd3fc;">Logout</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
