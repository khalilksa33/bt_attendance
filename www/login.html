<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Check-in - Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-panel { max-width: 420px; margin: 0 auto; }
    </style>
    <script src="login.js"></script>
</head>
<body>
    <div class="page-shell">
        <div class="hero-panel" style="grid-template-columns: 1fr;">
            <div class="hero-card">
                <h2>Remote Check-in</h2>
                <p style="color: #cbd5e1; margin-bottom: 24px;">Log in with your ERP credentials to submit check-ins.</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username / Email</label>
                        <input id="username" name="username" type="text" placeholder="Your ERP username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" placeholder="Your ERP password" required>
                    </div>
                    <button type="submit">Login</button>
                    <div id="message" class="message"></div>
                </form>

                <div class="hint-panel">
                    <p>Use your company ERP credentials. Your login is secure and only stored in this session.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
